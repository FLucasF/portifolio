name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # A duração dos cargos é calculada na build. Sem esta reconstrução mensal,
  # "1 ano 5 meses" ficaria parado no dia do último push.
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez. Um push novo cancela a fila, não o deploy em curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # Defina estas duas variáveis em Settings > Secrets and variables >
          # Actions > Variables se publicar em subpasta. Veja o README.
          SITE_URL: ${{ vars.SITE_URL || 'https://flucasf.github.io' }}
          BASE_PATH: ${{ vars.BASE_PATH || '/' }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
